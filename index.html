<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRF Park TLV — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=18" />
</head>
<body>
  <!-- #stage is a fixed 16:9 box (sized by js/dashboard.js off window
       dimensions); on a 16:9 TV it fills the screen exactly, on any other
       aspect ratio it letterboxes instead of stretching. -->
  <div id="stage">

  <!-- ======================= CLOSED SCREEN ======================= -->
  <div id="closed-screen">
    <img class="closed-logo" src="assets/logo.svg" alt="SRF Park TLV" />
    <div class="closed-sub" id="closed-sub"></div>
    <div class="closed-clock" id="closed-clock"></div>
  </div>

  <!-- ======================= DASHBOARD =========================== -->
  <div id="dashboard">

    <header id="topbar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.svg" alt="SRF Park TLV" />
      </div>
      <div class="datetime">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
      <div class="weather">
        <div id="weather-temp">--°</div>
        <div class="weather-meta">
          <div id="weather-desc"></div>
          <div id="weather-wind"></div>
        </div>
      </div>
    </header>

    <!-- The lead: the next session is the only thing a passer-by can still
         act on, so it owns the largest block and carries the spot counts. -->
    <section id="hero">
      <div class="hero-text">
        <div class="hero-topline">
          <span class="hero-label" id="lbl-next">Next session</span>
          <span class="hero-countdown" id="nx-countdown"></span>
        </div>
        <div class="hero-main">
          <span class="hero-badge" id="nx-level"></span>
          <span class="hero-name" id="nx-name">—</span>
        </div>
        <div class="hero-time" id="nx-time"></div>
      </div>
      <div class="hero-spots">
        <div class="spots-label" id="lbl-spots">Spots left</div>
        <div class="spots-boxes" id="nx-spots"></div>
        <div class="spots-note" id="nx-note"></div>
      </div>
    </section>

    <!-- Status, not a call to action: what's already in the water stays
         readable but deliberately quiet. -->
    <section id="now-strip">
      <span class="now-label" id="lbl-now">Now in the water</span>
      <span class="now-body" id="now-body">—</span>
    </section>

    <!-- The pool lives in one box: Reef Left and Reef Right side by side as
         they are in the water, Bay spanning underneath them. .pool-grid is
         direction-pinned in CSS so left/right never mirror in RTL. -->
    <section id="zones">
      <div class="zone-card" id="pool-box">
        <div class="pool-grid">
          <div class="pool-cell" id="zone-left">
            <div class="zone-title">Reef Left</div>
            <div class="zone-status"></div>
            <div class="zone-program"></div>
            <div class="zone-places"></div>
            <div class="zone-time"></div>
          </div>
          <div class="pool-cell" id="zone-right">
            <div class="zone-title">Reef Right</div>
            <div class="zone-status"></div>
            <div class="zone-program"></div>
            <div class="zone-places"></div>
            <div class="zone-time"></div>
          </div>
          <div class="pool-cell" id="zone-bay">
            <div class="zone-title">BAY</div>
            <div class="zone-status"></div>
            <div class="zone-program"></div>
            <div class="zone-places"></div>
            <div class="zone-time"></div>
          </div>
        </div>
      </div>
      <!-- Today's event stays pinned; the rest roll through on a slow
           crossfade so the week ahead keeps moving without distracting. -->
      <div class="zone-card" id="events-card">
        <div class="zone-title" id="events-title">Upcoming Events</div>
        <div id="events-list">
          <div id="events-pinned"></div>
          <div id="events-rotating"></div>
        </div>
      </div>
    </section>

    <footer id="bottombar">
      <div id="updated"></div>
    </footer>

  </div>

  </div> <!-- #stage -->

  <!-- Invisible full-screen toggle. Tapping the top-right corner of the
       screen puts the TV's browser into full screen (and back out), so
       staff can hide the browser chrome without a keyboard. Deliberately
       unlabelled: it's for staff, not for customers reading the wall. -->
  <button id="fs-toggle" type="button" aria-label="Toggle full screen"></button>

  <script src="js/config.js?v=18"></script>
  <script src="js/strings.js?v=18"></script>
  <script src="js/dashboard.js?v=18"></script>
</body>
</html>
